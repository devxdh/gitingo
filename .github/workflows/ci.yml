name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }} - Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22', '1.23']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Formatting (gofmt)
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -coverprofile="coverage.out" ./...

      - name: Build Binary
        run: go build -v ./...
